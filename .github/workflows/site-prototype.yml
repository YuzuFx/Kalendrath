name: Site prototype (Playwright et Lighthouse)

on:
  pull_request:
    paths:
      - 'site-prototype/**'
      - '.github/workflows/site-prototype.yml'
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Le HTML généré est à jour
        run: |
          node build.mjs
          git diff --exit-code -- .
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Serveur statique
        run: python3 -m http.server 8765 &
      - name: Trois largeurs (390, 720, 2560)
        run: sleep 1 && node tests/responsive.mjs http://localhost:8765 captures
      - name: Lighthouse
        run: node tests/lighthouse.mjs http://localhost:8765
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-site
          path: site-prototype/captures
