<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Croquis de logo Kalendrath, piste Le Seuil">
  <title>Kalendrath, piste 8 : Le Seuil (croquis)</title>
  <desc>Un losange taillé en deux Éclats. L'obélisque n'est pas dessiné : il est le vide entre les deux, et une veine de mana court dans ce vide. La moitié droite a glissé de trois unités vers le haut, comme à la Rupture.</desc>
  <defs>
    <!-- Symbole sur une grille de 100 x 100 -->
    <g id="seuil">
      <!-- Éclat gauche : face éclairée -->
      <path fill="#E9BE74" d="M50 4 L8 50 L50 96 L50 91 L42 91 L45 27 L50 15 Z"/>
      <!-- Éclat droit : face d'ombre, décalé de 3 vers le haut (la Rupture) -->
      <path fill="#B58A45" transform="translate(0 -3)" d="M50 7 L92 53 L50 99 L50 94 L58 94 L55 30 L50 18 Z"/>
      <!-- La veine de mana dans le vide de l'obélisque -->
      <path d="M50 19 V88" stroke="#A3A1FF" stroke-width="3" stroke-linecap="square"/>
    </g>
    <g id="seuil-mono">
      <path d="M50 4 L8 50 L50 96 L50 91 L42 91 L45 27 L50 15 Z"/>
      <path transform="translate(0 -3)" d="M50 7 L92 53 L50 99 L50 94 L58 94 L55 30 L50 18 Z"/>
    </g>
  </defs>
  <rect width="720" height="360" fill="#0A0A14"/>
  <!-- Grand format -->
  <use href="#seuil" transform="translate(40 50) scale(2.2)"/>
  <!-- Lockup horizontal (lettrage provisoire, à dessiner) -->
  <use href="#seuil" transform="translate(300 62) scale(0.62)"/>
  <text x="372" y="108" fill="#E6E2D8" font-family="Cinzel, Marcellus, 'Times New Roman', serif" font-size="34" letter-spacing="7">KALENDRATH</text>
  <!-- Favicons 64, 32, 16 -->
  <rect x="300" y="200" width="64" height="64" rx="12" fill="#141B24"/>
  <use href="#seuil" transform="translate(306 206) scale(0.52)"/>
  <rect x="384" y="216" width="32" height="32" rx="6" fill="#141B24"/>
  <use href="#seuil" transform="translate(386 218) scale(0.28)"/>
  <rect x="436" y="224" width="16" height="16" rx="3" fill="#141B24"/>
  <use href="#seuil" transform="translate(436.5 224.5) scale(0.15)"/>
  <!-- Monochrome sur clair -->
  <rect x="480" y="190" width="200" height="84" fill="#F2EDE3"/>
  <use href="#seuil-mono" fill="#141B24" transform="translate(498 202) scale(0.6)"/>
  <text x="560" y="240" fill="#141B24" font-family="Cinzel, Marcellus, serif" font-size="12" letter-spacing="2">KALENDRATH</text>
  <text x="40" y="340" fill="#A8B0B9" font-family="sans-serif" font-size="12">8 · Le Seuil — croquis : l'obélisque est le vide entre deux Éclats. Lettrage provisoire.</text>
</svg>
